[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "invoicelens"
version = "0.1.0"
description = "Local-first invoice and receipt triage for sole proprietors, powered by an open-weight model running on your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dekita" }]
keywords = ["invoice", "receipt", "llm", "local", "gemma", "llama.cpp", "freelance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "requests>=2.28",
    "pypdf>=4.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
invoicelens = "invoicelens.cli:main"

[tool.setuptools]
packages = ["invoicelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
